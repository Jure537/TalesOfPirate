name: Sestava in paket Release za Windows

on:
  push:
    branches:
      - codex/windows-build-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-check:
    name: Preveri pripravo baze in racuna
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preveri svezi bazi in zavrnitev prepisovanja
        shell: powershell
        run: ./scripts/Test-LocalSetup.ps1

  build:
    needs: setup-check
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prenesi izvorno kodo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pripravi .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pripravi Visual Studio 2026
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Zabelezi razlicice orodij
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          dotnet --info | Tee-Object build-logs/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild -version | Tee-Object build-logs/msbuild-version.txt
          exit $LASTEXITCODE

      - name: Sestavi igro in streznike (Release x64)
        run: |
          & msbuild sources/talesofpirates.sln /restore /m:2 /p:Configuration=Release /p:Platform=x64 /nologo /verbosity:minimal "/flp:logfile=build-logs/build.log;verbosity=normal"
          exit $LASTEXITCODE

      - name: Preveri zbirki z igralnimi podatki
        shell: python
        run: |
          import json, sqlite3
          from pathlib import Path
          report = {}
          for name in ("gamedata.sqlite", "render.sqlite"):
              path = Path("databases") / name
              with sqlite3.connect(path.resolve().as_uri() + "?mode=ro", uri=True) as db:
                  result = db.execute("PRAGMA integrity_check").fetchall()
                  if result != [("ok",)]:
                      raise RuntimeError(f"{name}: {result}")
                  tables = db.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").fetchall()
                  report[name] = {"integrity": "ok", "tables": [row[0] for row in tables]}
          Path("build-logs/sqlite-check.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))

      - name: Zabelezi odvisnosti programov
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsPath/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'Orodje dumpbin ni na voljo.' }
          foreach ($path in @('Client/system/Game.exe', 'server/GameServer/GameServer.exe')) {
            $output = & $dumpbin.FullName /DEPENDENTS $path
            if ($LASTEXITCODE -ne 0) { throw "Pregled odvisnosti ni uspel: $path" }
            $output | Add-Content build-logs/native-dependencies.txt
            if ($output -match '(?i)(ucrtbased|vcruntime[0-9_]*d|msvcp[0-9_]*d)\.dll') {
              throw "Program Release se vedno zahteva knjiznico Debug: $path"
            }
          }

      - name: Pripravi celoten testni paket
        run: ./scripts/package-local-release.ps1

      - name: Shrani paket Release za prenos
        uses: actions/upload-artifact@v4
        with:
          name: tales-of-pirates-release-x64
          path: release-package/
          if-no-files-found: error
          retention-days: 7

      - name: Shrani dnevnik sestavljanja
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
