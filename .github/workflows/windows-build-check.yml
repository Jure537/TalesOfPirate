name: Preverjanje sestave za Windows

on:
  push:
    branches:
      - codex/windows-build-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Prenesi izvorno kodo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pripravi .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pripravi Visual Studio 2026
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Zabelezi razlicice orodij
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          dotnet --info | Tee-Object build-logs/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild -version | Tee-Object build-logs/msbuild-version.txt
          exit $LASTEXITCODE

      - name: Sestavi igro in streznike (Debug x64)
        run: |
          & msbuild sources/talesofpirates.sln /restore /m:2 /p:Configuration=Debug /p:Platform=x64 /nologo /verbosity:minimal "/flp:logfile=build-logs/build.log;verbosity=normal"
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "Sestavljanje ni uspelo. Podrobnosti so v build-logs/build.log." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Sestavljanje Debug x64 je uspelo. Zagon igre in streznika se ni preverjen." >> $env:GITHUB_STEP_SUMMARY
          }
          exit $buildExitCode


      - name: Preveri ustvarjene programe
        run: |
          $required = @(
            'Client/system/Game.exe',
            'server/GameServer/GameServer.exe',
            'sources/Dotnet/Servers/Account/Corsairs.AccountServer/bin/Debug/net10.0/Corsairs.AccountServer.dll',
            'sources/Dotnet/Servers/Gate/Corsairs.GateServer/bin/Debug/net10.0/Corsairs.GateServer.dll',
            'sources/Dotnet/Servers/Group/Corsairs.GroupServer/bin/Debug/net10.0/Corsairs.GroupServer.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Manjka rezultat sestavljanja: $path"
            }
          }
          @(
            "Tales of Pirates - diagnosticni programi Debug x64"
            "Commit: $env:GITHUB_SHA"
            ""
            "To ni pripravljen namestitveni paket igre."
            "Vsebuje sestavljene programe in njihove spremljevalne datoteke."
            "Podatkovna baza, igralne vsebine in lokalne povezave se niso nastavljene."
            "Debug programi lahko potrebujejo razvojne izvajalne knjiznice Visual C++."
            ".NET strezniki potrebujejo .NET 10."
            "Za zagon brez Visual Studia bo treba pripraviti in preveriti sestavo Release."
            "Zagon in igranje se nista preverjena."
          ) | Set-Content -Encoding utf8 BUILD-NOTES.txt
          Get-FileHash -Algorithm SHA256 $required |
            Format-Table -AutoSize |
            Out-String -Width 240 |
            Set-Content -Encoding utf8 build-logs/program-checksums.txt

      - name: Shrani testne programe za prenos
        uses: actions/upload-artifact@v4
        with:
          name: tales-of-pirates-debug-x64
          path: |
            BUILD-NOTES.txt
            Client/system/
            Client/licenses/
            server/GameServer/*.exe
            server/GameServer/*.dll
            sources/Dotnet/Servers/Account/Corsairs.AccountServer/bin/Debug/net10.0/
            sources/Dotnet/Servers/Gate/Corsairs.GateServer/bin/Debug/net10.0/
            sources/Dotnet/Servers/Group/Corsairs.GroupServer/bin/Debug/net10.0/
          if-no-files-found: error
          retention-days: 7

      - name: Shrani dnevnik sestavljanja
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
