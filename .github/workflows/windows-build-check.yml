name: Windows build check

on:
  push:
    branches:
      - codex/windows-build-check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Установить .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Найти MSBuild из Visual Studio 2026
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[18.0,19.0)'

      - name: Записать версии инструментов
        run: |
          New-Item -ItemType Directory -Force build-logs | Out-Null
          dotnet --info | Tee-Object build-logs/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild -version | Tee-Object build-logs/msbuild-version.txt
          exit $LASTEXITCODE

      - name: Собрать Debug x64
        run: |
          & msbuild sources/talesofpirates.sln /restore /m:2 /p:Configuration=Debug /p:Platform=x64 /nologo /verbosity:minimal "/flp:logfile=build-logs/build.log;verbosity=normal"
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "Сборка завершилась с ошибкой. Подробности в build-logs/build.log." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Сборка Debug x64 успешна. Запуск игры и сервера ещё не проверен." >> $env:GITHUB_STEP_SUMMARY
          }
          exit $buildExitCode

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7
